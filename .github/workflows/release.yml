name: Release to npm

# Sends a new version to npm when you publish a GitHub Release (Releases > Draft a new release >
# tag v0.2.1 > Publish).
#
# Uses npm "trusted publishing": GitHub proves to npm which repository and workflow is publishing,
# so no npm token is stored anywhere (npmjs.com > package > Settings > Trusted Publisher).
#
# The version is STAGED, not published straight away: it goes live only after you approve it with
# your 2FA on npmjs.com (package > Staged Packages > Approve) or with `npm stage approve <id>`.
# So even a compromised workflow can't release a version without you.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Lets GitHub issue the short-lived identity token that npm checks.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing and staged publishing need a newer npm than the one bundled with Node 22.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Release tag matches the package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm audit --omit=dev --audit-level=high
      - name: Typecheck, test and build
        run: npm run typecheck && npm test && npm run build
      # Provenance comes from package.json (publishConfig.provenance).
      - run: npm stage publish
