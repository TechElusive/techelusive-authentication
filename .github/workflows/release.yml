name: Release to npm

# Publishes to npm when you publish a GitHub Release (Releases > Draft a new release > tag v0.2.1 > Publish).
#
# Uses npm "trusted publishing": GitHub proves to npm which repository and workflow is publishing,
# so no npm token is stored anywhere. One-time setup on npmjs.com, after the first manual publish:
# package > Settings > Trusted Publisher > GitHub Actions, with this repository and the workflow
# file name "release.yml".

on:
  release:
    types: [published]

permissions:
  contents: read
  # Lets GitHub issue the short-lived identity token that npm checks.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a newer npm than the one bundled with Node 22.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Release tag matches the package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm audit --omit=dev --audit-level=high
      # prepublishOnly runs typecheck, tests and the build first. Provenance comes from package.json.
      - run: npm publish
