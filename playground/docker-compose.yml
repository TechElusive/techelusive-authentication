# Local services for the playground: PostgreSQL (required) and Redis (optional, shared rate limits).
# Start: npm run playground:db      Stop: docker compose -f playground/docker-compose.yml down
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techelusive_playground
    ports:
      - "5432:5432"
    volumes:
      - playground-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  playground-postgres:
